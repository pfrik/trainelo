name: Garmin Sync

on:
  schedule:
    # Once daily at 05:00 UTC — reduced from every 6h to avoid
    # Garmin's aggressive 429 rate limits on cloud IPs.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full sync (365 days) instead of incremental'
        required: false
        default: 'false'
        type: boolean
      days:
        description: 'Number of days to sync (overrides default)'
        required: false
        default: ''
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/garmin-sync/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/garmin-sync/requirements.txt

      - name: Run Garmin sync
        working-directory: scripts/garmin-sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAINELO_USER_ID: ${{ secrets.TRAINELO_USER_ID }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
        run: |
          if [ "${{ inputs.full_sync }}" = "true" ]; then
            python sync.py --full
          elif [ -n "${{ inputs.days }}" ]; then
            python sync.py --days ${{ inputs.days }}
          else
            python sync.py --days 5
          fi

      - name: Update GARMIN_TOKENS_BASE64 secret with fresh tokens
        if: always()
        working-directory: scripts/garmin-sync
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
        run: python update_github_secret.py
